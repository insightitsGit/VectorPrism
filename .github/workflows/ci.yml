name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install (editable)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest test_psm.py test_phases.py tests/test_ho005_regressions.py -q
      - name: Pilot check
        run: vectorprism pilot-check
      - name: Build package
        run: |
          python -m build
          twine check dist/*

  wheel-install:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Install wheel in clean env and verify assets
        run: |
          python -m venv /tmp/vpwheel
          /tmp/vpwheel/bin/pip install -U pip
          /tmp/vpwheel/bin/pip install dist/*.whl
          /tmp/vpwheel/bin/python -c "from importlib.resources import files; print(files('vectorprism').joinpath('schema.sql').read_text()[:80])"
          /tmp/vpwheel/bin/python -c "from vectorprism.paths import example_jsonl; print(example_jsonl('dense_pairs.example.jsonl'))"
          cd /tmp && /tmp/vpwheel/bin/vectorprism pilot-check
