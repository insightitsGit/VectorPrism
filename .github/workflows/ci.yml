name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest test_psm.py test_phases.py -q
      - name: Pilot check
        run: vectorprism pilot-check
      - name: Build package
        run: |
          python -m build
          twine check dist/*
